<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/iris-orbit-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>IRIS Orbit</title>
    <!-- Applies the saved/system theme before first paint (no light flash). -->
    <script src="/theme-init.js"></script>
    <!-- Google Fonts stylesheets are intentionally NOT given an SRI
         `integrity` attribute: Google serves different bytes to different
         browsers from this same URL (different font formats/subsets per
         User-Agent), so any single fixed hash would fail verification for
         some visitors and break font loading for them. This is a documented
         limitation of Google Fonts, not an oversight (see VAPT finding #10). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter = UI/body, Plus Jakarta Sans = headings, Fira Code = code.
         Bootstrap is bundled from npm in src/main.jsx (no CDN copy). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
