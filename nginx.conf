# Preserve an upstream-set X-Forwarded-Proto (TLS terminated in front of this
# container) instead of overwriting it with nginx's own $scheme, which is
# always "http" here — server.js's req.secure cookie logic depends on it.
map $http_x_forwarded_proto $proxy_x_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080; # unprivileged nginx image (see Dockerfile)
    server_name _;

    # VAPT finding 7.9 (CWE-200, Server Version Disclosure) — default nginx
    # reveals its exact version in the `Server` response header and on
    # default error pages (e.g. 403/404). This drops the version number,
    # leaving just `Server: nginx`.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://node_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_fwd_proto;
        # (no HSTS add_header here — the proxied Express app already sets it
        # via helmet(), and nginx passes that header through untouched)
    }

    # Serve React Vite App
    location / {
        try_files $uri $uri/ /index.html =404;
        # VAPT findings 7.7 (CWE-1021, Missing Anti-Clickjacking Protection)
        # and 7.8 (CWE-693, Missing HTTP Security Headers) — this HTML is
        # served directly by nginx, never passing through the Express app,
        # so helmet()'s security headers (which already cover the /api/
        # JSON responses) never reach it. Mirror the same set here.
        # CSP is limited to frame-ancestors (rather than helmet's full
        # default-src 'self' policy) because this page also loads the
        # Google reCAPTCHA script/iframe/fonts from google.com/gstatic.com —
        # a stricter script-src would need testing against that widget first.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 🔒 CSP (security review 2026-10-05): no third-party scripts (only reCAPTCHA), no
        # plugins, data may only be sent back to this site, frames limited to
        # YouTube/Office/Cloudinary/SharePoint/reCAPTCHA. 'unsafe-inline' is required
        # because HTML modules run inline scripts in blob: frames, which inherit
        # this policy. img-src allows any https image (card content uses many hosts).
        # Tested in Chrome on: home, Learn, journey, Pre-check, an HTML module.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com https://www.google.com/recaptcha/; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://view.officeapps.live.com https://docs.google.com https://res.cloudinary.com https://*.sharepoint.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
