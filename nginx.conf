# Preserve an upstream-set X-Forwarded-Proto (TLS terminated in front of this
# container) instead of overwriting it with nginx's own $scheme, which is
# always "http" here — server.js's req.secure cookie logic depends on it.
map $http_x_forwarded_proto $proxy_x_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080; # unprivileged nginx image (see Dockerfile)
    server_name _;

    # VAPT finding 7.9 (CWE-200, Server Version Disclosure) — default nginx
    # reveals its exact version in the `Server` response header and on
    # default error pages (e.g. 403/404). This drops the version number,
    # leaving just `Server: nginx`.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://node_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_fwd_proto;
        # (no HSTS add_header here — the proxied Express app already sets it
        # via helmet(), and nginx passes that header through untouched)
    }

    # 🔒 HTML learning modules run in this one page (Quiz.jsx frames it and
    # posts the module's HTML to public/module-frame.js). Module HTML is full
    # of inline <script> blocks and onclick="..." handlers, so ONLY this page
    # allows inline scripts (VAPT CWE-693: the app's own policy below does
    # not). Otherwise it's the app's policy minus reCAPTCHA — what modules
    # had before, nothing more. Modules stay inside the iframe's sandbox (no
    # allow-same-origin unless a superadmin marked the module trusted), and
    # frame-ancestors 'self' means only Orbit's own pages can embed it.
    # add_header here replaces every outer one, so the full set is repeated.
    location = /module-frame.html {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://view.officeapps.live.com https://docs.google.com https://res.cloudinary.com https://*.sharepoint.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Serve React Vite App
    location / {
        try_files $uri $uri/ /index.html =404;
        # VAPT findings 7.7 (CWE-1021, Missing Anti-Clickjacking Protection)
        # and 7.8 (CWE-693, Missing HTTP Security Headers) — this HTML is
        # served directly by nginx, never passing through the Express app,
        # so helmet()'s security headers (which already cover the /api/
        # JSON responses) never reach it. Mirror the same set here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 🔒 CSP (security review 2026-10-05): no third-party scripts (only reCAPTCHA), no
        # plugins, data may only be sent back to this site, frames limited to
        # YouTube/Office/Cloudinary/SharePoint/reCAPTCHA. img-src allows any https
        # image (card content uses many hosts).
        # No 'unsafe-inline' in script-src (VAPT CWE-693): the app has no inline
        # scripts; HTML modules run in /module-frame.html, which has its own policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://res.cloudinary.com https://www.google.com/recaptcha/; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://view.officeapps.live.com https://docs.google.com https://res.cloudinary.com https://*.sharepoint.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
